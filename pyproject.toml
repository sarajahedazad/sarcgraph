[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcgraph"
dynamic = ["version"]
description = "A software for sarcomere detection and tracking"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["sarcomere", "biomechanics", "image analysis", "tracking"]

authors = [
  { name = "Saeed Mohammadzadeh", email = "saeedmhz@bu.edu" }
]

maintainers = [
  { name = "Saeed Mohammadzadeh", email = "saeedmhz@bu.edu" },
  { name = "Emma Lejeune", email = "elejeune@bu.edu" }
]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]

dependencies = [
  "matplotlib==3.5.2",
  "networkx==2.8.4",
  "numpy==1.23.5",
  "pandas==1.5.2",
  "scikit-image==0.19.3",
  "scikit-learn==1.2.1",
  "scipy==1.10.0",
  "sk-video==1.1.10",
  "trackpy==0.6.1",
]

[project.urls]
homepage = "https://pypi.org/project/sarcgraph/"
documentation = "https://sarc-graph.readthedocs.io/en/latest/"
source = "https://github.com/Sarc-Graph/sarcgraph"

[tool.setuptools]
packages = ["sarcgraph"]

[tool.setuptools.dynamic]
version = { attr = "sarcgraph.__version__" }
readme = { file = ["README.md"] }